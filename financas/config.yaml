name: Finanças
version: "0.3.1"
slug: financas
description: Finanças da casa — importação de extratos CSV/OFX, categorias e resumo no Home Assistant
url: https://github.com/danielcosta42/financas-ha
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:finance
panel_title: Finanças
homeassistant_api: true
startup: application
boot: auto
map:
  - share:rw
options:
  pessoas:
    - Daniel
    - Naomi
  pasta_de_entrada: /share/financas/entrada
  ia_entidade: ai_task.ollama_casa
  ia_reserva: ai_task.openai_ai_task
  ia_automatica: true
schema:
  pessoas:
    - str
  pasta_de_entrada: str
  ia_entidade: str?
  ia_reserva: str?
  ia_automatica: bool?
