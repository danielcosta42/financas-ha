name: Finanças
version: "0.5.0"
slug: financas
description: Finanças da casa — extratos CSV/OFX/PDF, faturas e avisos de transação do e-mail, categorias e resumo no Home Assistant
url: https://github.com/danielcosta42/financas-ha
arch:
  - aarch64
  - amd64
ingress: true
ingress_port: 8099
panel_icon: mdi:finance
panel_title: Finanças
homeassistant_api: true
startup: application
boot: auto
map:
  - share:rw
options:
  pessoas:
    - Daniel
    - Naomi
  pasta_de_entrada: /share/financas/entrada
  ia_entidade: ai_task.ollama_casa
  ia_reserva: ai_task.openai_ai_task
  ia_automatica: true
  email_servidor: imap.gmail.com
  email_porta: 993
  email_pasta: INBOX
  email_dias: 60
  email_intervalo_min: 30
  pdf_senhas: []
schema:
  pessoas:
    - str
  pasta_de_entrada: str
  ia_entidade: str?
  ia_reserva: str?
  ia_automatica: bool?
  email_servidor: str?
  email_porta: port?
  email_usuario: email?
  email_senha_de_app: password?
  email_pasta: str?
  email_dias: int(1,365)?
  email_intervalo_min: int(10,1440)?
  pdf_senhas:
    - password
  pasta_faturas: str?
